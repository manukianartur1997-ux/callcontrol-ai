name = "callcontrol-ai-demo"
main = "cloudflare-worker.example.js"
compatibility_date = "2026-05-12"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"

# Public (browser-visible by design) values the worker also needs. The
# publishable key drives the anti-squatting PUBLIC signup path in
# saas/worker/api.js registerOrg — only RLS-gated access, never privileged.
[vars]
SUPABASE_PUBLISHABLE_KEY = "sb_publishable_F4whCRaKdrKFBtv2kevG5A_tcM1k3iS"

# Two cron triggers, branched by event.cron in scheduled():
#   "0 17 * * *"    daily, 17:00 UTC (20:00 Kyiv in summer) — dailyDigest (per-
#                   org Telegram digest), purgeExpiredData (retention scrub),
#                   platformDigest (operator-facing summary to
#                   PLATFORM_ALERT_CHAT_ID). Silent no-ops until their
#                   migrations (0004/0005/0008) are applied or the relevant
#                   secret is set.
#   "*/30 * * * *"  every 30 minutes — sweepStuckCalls (migration 0008): a call
#                   stuck on a setup gap that may now be fixed (AI key pasted,
#                   checklist created, PBX credentials added) retries itself,
#                   capped at RETRY_MAX_ATTEMPTS (saas/worker/api.js) so a
#                   permanently-broken org does not retry forever.
#
# Per-minute billing has no env/secret of its own: the house rate is the
# editable PLATFORM_DEFAULT_RATE constant in saas/worker/api.js and per-org
# overrides live in organizations.rate_per_minute (migration 0005). The payment
# gateway (Stripe/acquirer) is the operator's and hooks onto usage_ledger rows.
#
# PLATFORM_ALERT_CHAT_ID (optional secret, `wrangler secret put`): a Telegram
# chat id of the OPERATOR (Артур), separate from any client's own
# telegram_recipients. Without it platformDigest silently no-ops.
[triggers]
crons = ["0 17 * * *", "*/30 * * * *"]
